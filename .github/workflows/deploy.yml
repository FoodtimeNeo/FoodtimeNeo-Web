name: Web Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff HEAD^1 HEAD -- package.json 2>/dev/null \
            | grep -qE '^[+-][[:space:]]*"version"'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Check and build
        if: steps.version.outputs.changed == 'true'
        run: npm run check

      - name: Collect deploy files
        if: steps.version.outputs.changed == 'true'
        run: |
          mkdir -p deploy-artifact/scripts/deploy
          cp -a dist deploy-artifact/dist
          python3 - <<'PY' > deploy-artifact/downloads-files.json
          import hashlib, json, os
          root = 'dist/downloads'
          files = []
          for dirpath, _, filenames in os.walk(root):
              for name in filenames:
                  full = os.path.join(dirpath, name)
                  rel = os.path.relpath(full, root).replace(os.sep, '/')
                  digest = hashlib.sha256()
                  with open(full, 'rb') as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                          digest.update(chunk)
                  files.append({'path': rel, 'size': os.path.getsize(full), 'sha256': digest.hexdigest()})
          print(json.dumps(files, ensure_ascii=False))
          PY
          rm -rf deploy-artifact/dist/downloads
          cp scripts/deploy/prepare-web-release.js deploy-artifact/scripts/deploy/
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ -f "docs/releases/release-v${VERSION}.env.example" ]; then
            cp "docs/releases/release-v${VERSION}.env.example" deploy-artifact/release.env
          else
            : > deploy-artifact/release.env
          fi
          tar -czf web-dist.tar.gz -C deploy-artifact .

      - name: Publish deploy artifact
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view deploy-latest >/dev/null 2>&1; then
            gh release create deploy-latest --prerelease \
              --title "Deploy artifacts" \
              --notes "Automated deployment artifacts. Do not install."
          fi
          gh release upload deploy-latest web-dist.tar.gz --clobber

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$GH_TOKEN" | ssh -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "web ${{ github.run_id }} ${{ github.sha }}"
